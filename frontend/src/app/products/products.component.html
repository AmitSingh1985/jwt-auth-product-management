<div class="products-container">

  <div class="products-card">

    <div class="products-header">
      <div>
        <h1>Products</h1>
        <p>Manage your products</p>
      </div>

      <button
        type="button"
        class="add-button"
        (click)="openAddForm()">
        + Add Product
      </button>
    </div>

    <!-- Success Message -->
    <div
      *ngIf="successMessage"
      class="success-message">
      {{ successMessage }}
    </div>

    <!-- Error Message -->
    <div
      *ngIf="errorMessage"
      class="error-message">
      {{ errorMessage }}
    </div>

    <!-- Loading -->
    <div
      *ngIf="loading"
      class="loading">
      Loading products...
    </div>

    <!-- Product Table -->
    <div
      *ngIf="!loading && products.length > 0"
      class="table-container">

      <table>

        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody>

          <tr *ngFor="let product of products">

            <td>
              {{ product.id }}
            </td>

            <td>
              {{ product.name }}
            </td>

            <td>
              {{ product.price | number:'1.2-2' }}
            </td>

            <td>
              {{ product.quantity }}
            </td>

            <td class="actions">

              <button
                type="button"
                class="edit-button"
                (click)="editProduct(product)">
                Edit
              </button>

              <button
                type="button"
                class="delete-button"
                (click)="deleteProduct(product)">
                Delete
              </button>

            </td>

          </tr>

        </tbody>

      </table>

    </div>

    <!-- No Products -->
    <div
      *ngIf="!loading && products.length === 0"
      class="no-products">

      <p>No products found.</p>

      <button
        type="button"
        class="add-button"
        (click)="openAddForm()">
        Add Your First Product
      </button>

    </div>

    <!-- Add / Edit Form -->
    <div
      *ngIf="showForm"
      class="form-container">

      <h2>
        {{ editingProduct ? 'Edit Product' : 'Add Product' }}
      </h2>

      <form
        (ngSubmit)="saveProduct()"
        #productForm="ngForm">

        <div class="form-group">

          <label for="name">
            Product Name
          </label>

          <input
            id="name"
            type="text"
            name="name"
            [(ngModel)]="product.name"
            required
            maxlength="100"
            placeholder="Enter product name">

        </div>

        <div class="form-group">

          <label for="price">
            Price
          </label>

          <input
            id="price"
            type="number"
            name="price"
            [(ngModel)]="product.price"
            required
            min="0"
            step="0.01"
            placeholder="Enter price">

        </div>

        <div class="form-group">

          <label for="quantity">
            Quantity
          </label>

          <input
            id="quantity"
            type="number"
            name="quantity"
            [(ngModel)]="product.quantity"
            required
            min="0"
            step="1"
            placeholder="Enter quantity">

        </div>

        <div class="form-actions">

          <button
            type="submit"
            class="save-button"
            [disabled]="productForm.invalid">

            {{ editingProduct ? 'Update Product' : 'Add Product' }}

          </button>

          <button
            type="button"
            class="cancel-button"
            (click)="cancelForm()">

            Cancel

          </button>

        </div>

      </form>

    </div>

    <!-- Back to Dashboard -->
    <button
      type="button"
      class="dashboard-button"
      (click)="goToDashboard()">

      Back to Dashboard

    </button>

  </div>

</div>
