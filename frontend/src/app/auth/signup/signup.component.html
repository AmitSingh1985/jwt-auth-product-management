<div class="signup-container">

  <div class="signup-card">

    <h1>Create Account</h1>

    <p class="subtitle">
      Register a new user account
    </p>

    <!-- Messages -->

    <div
      *ngIf="message"
      class="success-message">
      {{ message }}
    </div>

    <div
      *ngIf="errorMessage"
      class="error-message">
      {{ errorMessage }}
    </div>


    <!-- Registration Form -->

    <form
      *ngIf="!otpSent"
      (ngSubmit)="sendOtp()">

      <!-- Username -->

      <div class="form-group">
        <label for="username">
          Username
        </label>

        <input
          id="username"
          type="text"
          name="username"
          [(ngModel)]="username"
          minlength="8"
          maxlength="50"
          required
          placeholder="Enter username">
      </div>


      <!-- Email -->

      <div class="form-group">
        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          required
          placeholder="Enter email">
      </div>


      <!-- Password -->

      <div class="form-group">
        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          minlength="8"
          maxlength="12"
          required
          placeholder="8-12 characters">
      </div>


      <!-- User Type -->

      <div class="form-group">
        <label for="userType">
          User Type
        </label>

        <select
          id="userType"
          name="userType"
          [(ngModel)]="userType"
          required>

          <option value="STANDARD_USER">
            Standard User
          </option>

          <option value="ADMINISTRATOR">
            Administrator
          </option>

        </select>
      </div>


      <!-- Send OTP -->

      <button
        type="submit"
        [disabled]="loading">

        {{ loading ? 'Sending OTP...' : 'Send OTP' }}

      </button>

    </form>


    <!-- OTP Verification -->

    <div *ngIf="otpSent">

      <p class="otp-info">
        OTP has been generated for
        <strong>{{ email }}</strong>
      </p>


      <!-- Test OTP -->

      <div
        *ngIf="testOtp"
        class="test-otp">

        Test OTP:
        <strong>{{ testOtp }}</strong>

      </div>


      <div class="form-group">

        <label for="otp">
          Enter OTP
        </label>

        <input
          id="otp"
          type="text"
          name="otp"
          [(ngModel)]="otp"
          maxlength="6"
          inputmode="numeric"
          placeholder="Enter 6-digit OTP">

      </div>


      <button
        type="button"
        (click)="verifyOtp()"
        [disabled]="loading">

        {{ loading ? 'Verifying...' : 'Verify OTP' }}

      </button>

    </div>


    <!-- Back to Login -->

    <div class="login-link">

      <p>
        Already have an account?

        <a
          href="javascript:void(0)"
          (click)="backToLogin()">

          Login here

        </a>
      </p>

    </div>

  </div>

</div>
